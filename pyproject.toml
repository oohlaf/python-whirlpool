[build-system]
requires = [
    "setuptools>=61; python_version>='3.7'",
    "setuptools<45; python_version<'3.7'",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "Whirlpool"
version = "1.1.2"
description = "Bindings for whirlpool hash reference implementation."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=2.7,!=3.0.*,!=3.1.*,!=3.2.*,!=3.3.*,!=3.4.*,!=3.5.*,!=3.6.*,!=3.7.*,!=3.8.*"
license = { text = "Public Domain" }
authors = [{ name = "Olaf Conradi", email = "olaf@conradi.org" }]
keywords = ["digest", "hashlib", "whirlpool"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: Public Domain",
    "Programming Language :: C",
    "Programming Language :: Python",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/oohlaf/python-whirlpool"
Repository = "https://github.com/oohlaf/python-whirlpool"
Changelog = "https://github.com/oohlaf/python-whirlpool/blob/master/CHANGELOG.md"

[tool.setuptools]
packages = []
include-package-data = false
