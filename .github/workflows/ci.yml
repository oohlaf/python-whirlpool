name: CI

on:
  push:
    branches:
    - master
    - main
    tags:
    - 'v*'
  pull_request:


jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          python-version: '3.9'
        - os: macos-latest
          python-version: '3.9'
        - os: windows-latest
          python-version: '3.9'
        - os: ubuntu-latest
          python-version: '3.10'
        - os: macos-latest
          python-version: '3.10'
        - os: windows-latest
          python-version: '3.10'
        - os: ubuntu-latest
          python-version: '3.11'
        - os: macos-latest
          python-version: '3.11'
        - os: windows-latest
          python-version: '3.11'
        - os: ubuntu-latest
          python-version: '3.12'
        - os: macos-latest
          python-version: '3.12'
        - os: windows-latest
          python-version: '3.12'
        - os: ubuntu-latest
          python-version: '3.13'
        - os: macos-latest
          python-version: '3.13'
        - os: windows-latest
          python-version: '3.13'
        - os: ubuntu-latest
          python-version: '3.14'
        - os: macos-latest
          python-version: '3.14'
        - os: windows-latest
          python-version: '3.14'
        - os: ubuntu-latest
          python-version: 'pypy2'
        - os: ubuntu-latest
          python-version: 'pypy3'

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      if: matrix.python-version != 'pypy2'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install PyPy2 from source
      if: matrix.python-version == 'pypy2'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libbz2-dev libffi-dev libssl-dev libsqlite3-dev zlib1g-dev libncurses5-dev libgdbm-dev libc6-dev tk-dev libreadline-dev liblzma-dev
        git clone --depth 1 https://github.com/pypy/pypy.git /tmp/pypy2
        cd /tmp/pypy2
        python3 ./rpython/bin/rpython --version || true
        echo "PyPy2 provisioning is not supported by the GitHub-hosted runner image; this job is expected to fail unless a compatible toolchain is available."
        exit 1

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel

    - name: Install package
      run: |
        python -m pip install .

    - name: Run tests
      run: |
        python -m unittest discover -s test -p 'test_*.py'

  test-py27:
    name: Python 2.7 on Ubuntu
    runs-on: ubuntu-latest
    container:
      image: python:2.7.18-buster

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Build extension in place
      run: |
        python setup.py build_ext --inplace

    - name: Run tests
      run: |
        python -m unittest discover -s test -p 'test_*.py'

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [ test, test-py27 ]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Build source and wheel distributions
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
